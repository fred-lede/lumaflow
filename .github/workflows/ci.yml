name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            unzip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm run test -- --run

      - name: Check Rust formatting
        # Blocking: rustfmt owns the Rust layout, so a formatting drift fails
        # the build instead of landing in a review diff.
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Lint Rust backend
        # Blocking: `-D warnings` means a new clippy warning fails the build.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test Rust backend
        # The real-media integration target is asset-gated and runs in the
        # separate `real-media` advisory job in this workflow (non-blocking:
        # it reports failures without red-ing the workflow).
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib

      - name: Check deterministic fixture contract
        run: npm run test -- --run tests/fixtures/contract.spec.ts

      - name: Check source third-party notice
        run: node --experimental-strip-types scripts/check-third-party-licenses.ts --source-only

      - name: Build Tauri package smoke test
        run: npm exec -- tauri build --debug --bundles deb

  msrv:
    name: Rust MSRV gate
    # Blocking: the crate must compile with the exact toolchain version declared
    # as `rust-version` in src-tauri/Cargo.toml. The version is read from that
    # file, so the declaration and the gate cannot drift apart. Deterministic by
    # construction, so it gates merges directly like fmt/clippy instead of
    # starting out advisory.
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            unzip

      - name: Install the declared MSRV toolchain
        id: msrv
        shell: bash
        run: |
          set -euo pipefail
          manifest=src-tauri/Cargo.toml
          # `grep -c` exits 1 when nothing matches, which `set -e` would turn into
          # an unexplained step failure, so the count is captured before it is judged.
          count=$(grep -cE '^[[:space:]]*rust-version[[:space:]]*=' "$manifest" || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::$manifest must declare rust-version exactly once (found $count)"
            exit 1
          fi
          # Tolerates indentation and a trailing comment; a two-component version
          # such as 1.88 is a valid MSRV, so the shape check accepts both.
          msrv="$(sed -nE 's/^[[:space:]]*rust-version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$manifest" | head -n1)"
          if [[ ! "$msrv" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::rust-version in $manifest must be a plain version such as 1.88.0 (got '$msrv')"
            exit 1
          fi
          echo "Declared MSRV: rustc $msrv"
          rustup toolchain install "$msrv" --profile minimal --no-self-update
          echo "toolchain=$msrv" >>"$GITHUB_OUTPUT"

      - name: Check the crate on the declared MSRV
        # `--locked` keeps this reproducible: the gate builds the committed
        # dependency graph, not whatever a fresh resolve would pick today. A
        # failure here naming the lock file means the Cargo.lock was not committed.
        shell: bash
        run: |
          set -euo pipefail
          cargo +"${{ steps.msrv.outputs.toolchain }}" check \
            --manifest-path src-tauri/Cargo.toml --locked --all-targets

      - name: Report the measured floor next to the declared one
        # The gate proves the declared floor builds. This reports the other
        # direction, which nothing else catches: a declaration raised above the
        # measured floor stays green while restricting contributors for free.
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --locked --format-version 1 --manifest-path src-tauri/Cargo.toml |
            python3 -c '
          import json, re, sys

          def key(value):
              parts = [int(chunk) for chunk in re.findall(r"\d+", value)]
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          declared = sys.argv[1]
          packages = json.load(sys.stdin)["packages"]
          measured = max((p["rust_version"] for p in packages if p.get("rust_version")), key=key, default=None)
          if measured is None:
              print(f"::warning::no package in Cargo.lock declares a rust-version, so the declared MSRV {declared} is unmeasured")
          elif key(declared) > key(measured):
              print(f"::warning::rust-version {declared} is above the measured floor {measured}; lower it or record why the headroom is wanted")
          else:
              print(f"Measured floor: rustc {measured}. Declared: rustc {declared}.")
          ' "${{ steps.msrv.outputs.toolchain }}"

  real-media:
    name: Real-media boundary (advisory)
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    continue-on-error: true
    env:
      LUMAFLOW_FFMPEG_TEST_BIN: ${{ github.workspace }}/src-tauri/binaries/linux-x64/ffmpeg
      LUMAFLOW_FFPROBE_TEST_BIN: ${{ github.workspace }}/src-tauri/binaries/linux-x64/ffprobe

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            unzip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare pinned FFmpeg assets
        run: npm run prepare:ffmpeg -- --target linux-x64

      - name: Generate deterministic fixtures
        run: npm run fixtures

      - name: Run real-media Cargo integration
        id: cargo_real_media
        run: cargo test --manifest-path src-tauri/Cargo.toml --test real_media_fixtures

      - name: Run real-media E2E suite
        id: e2e_suite
        run: npm run test:e2e

      - name: Report advisory failure
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.cargo_real_media.outcome }}" != "success" ] || [ "${{ steps.e2e_suite.outcome }}" != "success" ]; then
            echo "::warning::real-media advisory layer failed; merge is not blocked by this job"
            {
              echo "## real-media advisory failure"
              echo ""
              echo "- cargo outcome: \`${{ steps.cargo_real_media.outcome }}\`"
              echo "- e2e outcome: \`${{ steps.e2e_suite.outcome }}\`"
              echo ""
              echo "This job is advisory. Do not set it as a required check while it is advisory."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  rust-test-soak:
    name: Rust test soak (advisory)
    # The lib suite was flaky twice (ETXTBSY on freshly written fixture
    # executables, and a scheduler counting race). Those races only show up
    # under repeated runs and high --test-threads, which the single blocking
    # `Test Rust backend` run does not exercise. This job hammers the same
    # suite so a regression reports here instead of blocking a merge.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            unzip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Soak the Rust lib suite across thread counts
        id: rust_soak
        shell: bash
        run: |
          set -uo pipefail
          # Build once, then run the compiled test binary directly: going
          # through `cargo test` for every iteration spends the budget on cargo
          # freshness checks instead of on test runs.
          binary="$(cargo test --manifest-path src-tauri/Cargo.toml --lib \
            --no-run --message-format=json 2>/dev/null |
            python3 -c '
          import json, sys
          found = ""
          for line in sys.stdin:
              try:
                  message = json.loads(line)
              except ValueError:
                  continue
              if message.get("reason") == "compiler-artifact" and \
                     message.get("profile", {}).get("test") and message.get("executable"):
                  found = message["executable"]
          print(found)
          ' |
            tail --lines=1)"
          if [ -z "$binary" ]; then
            echo "::error::could not locate the compiled lib test artifact"
            exit 1
          fi
          case "$binary" in
            /*) ;;
            *) binary="$PWD/$binary" ;;
          esac
          echo "soak artifact: $binary"
          # Run from the crate directory, the working directory cargo itself
          # uses when it runs the test binary.
          cd src-tauri
          runs=0
          failures=0
          truncated=0
          # A wall-clock budget inside the step: a hung run should fail this
          # step, which `continue-on-error` masks, rather than be cancelled by
          # the job timeout, which it does not.
          #
          # Calibrated to the suite's real per-run cost, measured locally on
          # this branch (a GitHub-hosted runner is typically slower, so the
          # projection is padded): the watchdog tests wait out deliberately
          # short deadlines, so one full-suite run costs ~5.3 s at
          # --test-threads=1 and ~1.4 s at the higher counts (0.15 s and 0.05 s
          # before those tests existed). 400 runs therefore project to ~960 s
          # here; the 1450 s budget was set from the earlier calibration
          # (~1140 s) and is kept because soak budgets only ever go up, which
          # also leaves room for runner variance under the 30-minute job
          # timeout.
          deadline=$((SECONDS + 1450))
          for threads in 1 16 64 128; do
            for iteration in $(seq 1 100); do
              if [ "$SECONDS" -ge "$deadline" ]; then
                truncated=1
                echo "::error::soak budget exhausted after ${runs} runs (threads=${threads})"
                break 2
              fi
              runs=$((runs + 1))
              if ! "$binary" --test-threads="$threads" >/tmp/soak.log 2>&1; then
                failures=$((failures + 1))
                echo "::error::soak run failed (threads=${threads}, iteration=${iteration})"
                tail --lines=40 /tmp/soak.log
              fi
            done
          done
          echo "runs=${runs}" >>"$GITHUB_OUTPUT"
          echo "failures=${failures}" >>"$GITHUB_OUTPUT"
          echo "truncated=${truncated}" >>"$GITHUB_OUTPUT"
          if [ "$failures" -ne 0 ] || [ "$truncated" -ne 0 ]; then
            exit 1
          fi

      - name: Report soak result
        if: always()
        shell: bash
        run: |
          {
            echo "## Rust test soak (advisory)"
            echo ""
            echo "- runs: \`${{ steps.rust_soak.outputs.runs }}\` across thread counts 1, 16, 64, 128"
            echo "- failures: \`${{ steps.rust_soak.outputs.failures }}\`"
            echo "- budget exhausted early: \`${{ steps.rust_soak.outputs.truncated }}\`"
            echo "- outcome: \`${{ steps.rust_soak.outcome }}\`"
            echo ""
            echo "This job is advisory. Do not set it as a required check while it is advisory."
          } >>"$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.rust_soak.outcome }}" != "success" ]; then
            echo "::warning::Rust test soak failed; merge is not blocked by this job"
          fi

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: check
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-14
            bundle: dmg
            archive_url: https://github.com/zackees/ffmpeg-bins2/releases/download/v8.1.2/darwin_arm64.zip
            archive_file: darwin_arm64.zip
            archive_sha256: 842ba18551e73f1f7f0e92408b210503fc9a13b88182db2014fd553bce990895
          - target: darwin-x64
            runner: macos-13
            bundle: dmg
            archive_url: https://github.com/zackees/ffmpeg-bins2/releases/download/v8.1.2/darwin_x64.zip
            archive_file: darwin_x64.zip
            archive_sha256: 60839c7196d19512e6b1fc9f9f46897a39438e408f4c95c28ebe178d080c038e
          - target: windows-x64
            runner: windows-2022
            bundle: nsis
            archive_url: https://github.com/GyanD/codexffmpeg/releases/download/8.1.2/ffmpeg-8.1.2-full_build.zip
            archive_file: ffmpeg-8.1.2-full_build.zip
            archive_sha256: b8cdefab5f50590a076c27c2b56b0294a0e6154faded28ba1ba05ebc4f801f57
          - target: linux-x64
            runner: ubuntu-22.04
            bundle: appimage
            archive_url: https://github.com/zackees/ffmpeg-bins2/releases/download/v8.1.2/linux_x64.zip
            archive_file: linux_x64.zip
            archive_sha256: 150f20cfa659754115b74c2aa32f0e1aa150d08a14191156875c8efeb5713b29
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            unzip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Download pinned FFmpeg archive on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p "src-tauri/binaries/${{ matrix.target }}"
          curl --fail --location --retry 3 --retry-delay 2 \
            "${{ matrix.archive_url }}" \
            --output "src-tauri/binaries/${{ matrix.archive_file }}"
          printf '%s  %s\n' "${{ matrix.archive_sha256 }}" "src-tauri/binaries/${{ matrix.archive_file }}" | shasum -a 256 -c -

      - name: Download pinned FFmpeg archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries/${{ matrix.target }}" | Out-Null
          Invoke-WebRequest -Uri "${{ matrix.archive_url }}" -OutFile "src-tauri/binaries/${{ matrix.archive_file }}"
          if ((Get-FileHash "src-tauri/binaries/${{ matrix.archive_file }}" -Algorithm SHA256).Hash.ToLowerInvariant() -ne "${{ matrix.archive_sha256 }}") { throw "FFmpeg archive SHA-256 mismatch" }

      - name: Extract pinned FFmpeg archive on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          work="${RUNNER_TEMP}/lumaflow-ffmpeg"
          rm -rf "$work"
          mkdir -p "$work"
          unzip -q "src-tauri/binaries/${{ matrix.archive_file }}" -d "$work"
          ffmpeg_path="$(find "$work" -type f -name ffmpeg -print -quit)"
          ffprobe_path="$(find "$work" -type f -name ffprobe -print -quit)"
          test -n "$ffmpeg_path" && test -n "$ffprobe_path"
          cp "$ffmpeg_path" "src-tauri/binaries/${{ matrix.target }}/ffmpeg"
          cp "$ffprobe_path" "src-tauri/binaries/${{ matrix.target }}/ffprobe"
          chmod 755 "src-tauri/binaries/${{ matrix.target }}/ffmpeg" "src-tauri/binaries/${{ matrix.target }}/ffprobe"
          mkdir -p "src-tauri/binaries/${{ matrix.target }}/licenses"
          find "$work" -type f \( -iname 'license*' -o -iname 'copying*' -o -iname 'readme*' \) -exec cp {} "src-tauri/binaries/${{ matrix.target }}/licenses/ \;
          test -n "$(find "src-tauri/binaries/${{ matrix.target }}/licenses" -type f -print -quit)"
          "src-tauri/binaries/${{ matrix.target }}/ffmpeg" -buildconf > "src-tauri/binaries/${{ matrix.target }}/ffmpeg-buildconf.txt"

      - name: Extract pinned FFmpeg archive on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "lumaflow-ffmpeg"
          Remove-Item -Recurse -Force -ErrorAction SilentlyContinue $work
          Expand-Archive -Path "src-tauri/binaries/${{ matrix.archive_file }}" -DestinationPath $work
          $ffmpeg = Get-ChildItem -Path $work -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $work -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if ($null -eq $ffmpeg -or $null -eq $ffprobe) { throw "FFmpeg or FFprobe executable is absent from the release archive" }
          Copy-Item $ffmpeg.FullName "src-tauri/binaries/${{ matrix.target }}/ffmpeg.exe"
          Copy-Item $ffprobe.FullName "src-tauri/binaries/${{ matrix.target }}/ffprobe.exe"
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries/${{ matrix.target }}/licenses" | Out-Null
          Get-ChildItem -Path $work -Recurse -File | Where-Object { $_.Name -match '^(LICENSE|COPYING|README)' } | Copy-Item -Destination "src-tauri/binaries/${{ matrix.target }}/licenses" -Force
          if (-not (Get-ChildItem "src-tauri/binaries/${{ matrix.target }}/licenses" -File)) { throw "License files are absent from the release archive" }
          & "src-tauri/binaries/${{ matrix.target }}/ffmpeg.exe" -buildconf | Out-File -Encoding utf8 "src-tauri/binaries/${{ matrix.target }}/ffmpeg-buildconf.txt"

      - name: Verify FFmpeg and FFprobe assets
        shell: bash
        run: |
          node --experimental-strip-types scripts/verify-ffmpeg-assets.ts \
            --target "${{ matrix.target }}" \
            --asset-dir "src-tauri/binaries/${{ matrix.target }}" \
            --archive "src-tauri/binaries/${{ matrix.archive_file }}"

      - name: Reject machine-local macOS FFmpeg dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for tool in \
            "src-tauri/binaries/${{ matrix.target }}/ffmpeg" \
            "src-tauri/binaries/${{ matrix.target }}/ffprobe"; do
            if otool -L "$tool" | grep -Eq '/(opt/homebrew|usr/local/Cellar)/'; then
              echo "Refusing to package a Homebrew-linked media tool: $tool"
              exit 1
            fi
          done

      - name: Generate and verify target third-party notice
        shell: bash
        run: |
          node --experimental-strip-types scripts/check-third-party-licenses.ts \
            --target "${{ matrix.target }}" \
            --asset-dir "src-tauri/binaries/${{ matrix.target }}" \
            --archive "src-tauri/binaries/${{ matrix.archive_file }}" \
            --write
          node --experimental-strip-types scripts/check-third-party-licenses.ts \
            --target "${{ matrix.target }}" \
            --asset-dir "src-tauri/binaries/${{ matrix.target }}" \
            --archive "src-tauri/binaries/${{ matrix.archive_file }}"

      - name: Remove source archive before packaging
        shell: bash
        run: rm "src-tauri/binaries/${{ matrix.archive_file }}"

      - name: Build release bundle
        shell: bash
        run: npm exec -- tauri build --bundles "${{ matrix.bundle }}"

      - name: Write release checksums on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          find src-tauri/target/release/bundle -type f -print0 | sort -z | xargs -0 shasum -a 256 > "checksums-${{ matrix.target }}.sha256"

      - name: Write release checksums on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path "src-tauri/target/release/bundle" -Recurse -File |
            Sort-Object FullName |
            ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.FullName)"
            } | Set-Content -Encoding utf8 "checksums-${{ matrix.target }}.sha256"

      - name: Upload release bundle and checksums
        uses: actions/upload-artifact@v4
        with:
          name: lumaflow-${{ matrix.target }}
          path: |
            src-tauri/target/release/bundle/**
            checksums-${{ matrix.target }}.sha256

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Publish bundles and checksums
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/**
