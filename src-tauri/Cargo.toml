[package]
name = "lumaflow"
version = "0.1.0"
description = "LumaFlow lossless-first media converter"
authors = ["LumaFlow contributors"]
license = "MIT"
edition = "2021"
# Floor measured from the committed Cargo.lock, not an aspiration. Re-measure it
# with the recipe in docs/releasing.md ("Rust MSRV gate"); the CI `msrv` job
# compiles against exactly this version.
rust-version = "1.88.0"

[lib]
name = "lumaflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.3"
