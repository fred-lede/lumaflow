[package]
name = "lumaflow"
version = "0.1.0"
description = "LumaFlow lossless-first media converter"
authors = ["LumaFlow contributors"]
license = "MIT"
edition = "2021"
# Measured floor of the committed Cargo.lock, not an aspiration: darling@0.23.0,
# plist@1.10.0, serde_with_macros@3.22.0 and time@0.3.55 all declare rustc 1.88.0,
# and 23 packages in the graph build with edition 2024 (Cargo >= 1.85). The CI
# `msrv` job reads this value and compiles the crate with exactly that toolchain.
rust-version = "1.77.2"

[lib]
name = "lumaflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
tauri-plugin-dialog = "=2.7.3"
